[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Package identity ──────────────────────────────────────────────────────────
[project]
name = "nexus-a2a"
version = "1.3.0"
description = "A developer-friendly Python package for building AI agent-to-agent (A2A) communication with ease."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "HongZiro" }
]
keywords = ["a2a", "agent", "multi-agent", "ai", "llm", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ── Runtime dependencies — must be an ARRAY under [project], not a table ──────
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "python-jose>=3.3",
  "click>=8.1",
  "rich>=13.0",
]

# ── Optional extras ───────────────────────────────────────────────────────────
[project.optional-dependencies]
redis    = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
all      = ["redis>=5.0", "asyncpg>=0.29"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "anyio[trio]>=4.3",
  "ruff>=0.4",
  "mypy>=1.10",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "respx>=0.21",
  "asyncpg>=0.29",
  "redis>=5.0",
]

# ── Project links ─────────────────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/dhruvil05/nexus-a2a"
Documentation = "https://github.com/dhruvil05/nexus-a2a#readme"
Issues        = "https://github.com/dhruvil05/nexus-a2a/issues"

# ── CLI entry point ───────────────────────────────────────────────────────────
[project.scripts]
nexus = "nexus_a2a.cli.main:cli"

# ── Hatch build ───────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["nexus_a2a"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths    = ["tests"]
addopts      = ["--tb=short", "-q"]
markers      = [
  "integration: tests requiring real HTTP servers",
  "slow: tests taking >2s",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length    = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["nexus_a2a"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true