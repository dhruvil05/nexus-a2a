# .github/workflows/publish.yml
#
# Publish to PyPI — triggered when a version tag is pushed.
#
# Trigger:
#   git tag v1.3.0
#   git push origin v1.3.0
#
# Flow:
#   1. validate      — version tag matches pyproject.toml version
#   2. test          — full test suite must pass before publish
#   3. build         — build wheel + sdist
#   4. publish-pypi  — upload via OIDC Trusted Publishing (no API key needed)
#   5. github-release — create GitHub Release with assets + auto changelog
#
# One-time setup required:
#   PyPI: Settings → Publishing → Add trusted publisher
#         Owner: dhruvil05  Repo: nexus-a2a  Workflow: publish.yml
#
# FIXES applied vs original:
#   - Removed duplicate top-level env: block (was empty + full = YAML parse error)
#   - Fixed permissions.id-token: write  (was a hardcoded PyPI token string — WRONG!)
#   - Updated setup-uv to v4
#   - Fixed GITHUB_OUTPUT syntax for modern runners

name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"           # v1.3.0
      - "v[0-9]+.[0-9]+.[0-9]+.post[0-9]+" # v1.3.0.post1

# Only one publish can run at a time — never cancel in progress
concurrency:
  group: publish
  cancel-in-progress: false

# FIX: single env block (original had two, causing YAML duplicate key error)
env:
  UV_VERSION: "0.5.x"
  PYTHON_VERSION: "3.12"

# ── Step 1: Validate version tag ───────────────────────────────────────────────
jobs:
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version (strip leading v)
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG  →  Version: $VERSION"

      - name: Read version from pyproject.toml
        id: pyproject
        run: |
          PKG_VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/.*= *"//' | sed 's/"//')
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "pyproject.toml version: $PKG_VERSION"

      - name: Fail if versions don't match
        run: |
          TAG_VER="${{ steps.extract.outputs.version }}"
          PKG_VER="${{ steps.pyproject.outputs.pkg_version }}"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::Version mismatch!"
            echo "  Tag version:            $TAG_VER"
            echo "  pyproject.toml version: $PKG_VER"
            echo "  Update pyproject.toml version before pushing the tag."
            exit 1
          fi
          echo "✅ Versions match: $TAG_VER"

# ── Step 2: Full test suite ────────────────────────────────────────────────────
  test:
    name: Test before publish
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package + dev dependencies
        run: uv pip install --system -e ".[dev,all]"

      - name: Run unit tests
        run: pytest -m "not integration" --tb=short -q

# ── Step 3: Build ──────────────────────────────────────────────────────────────
  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build wheel + sdist
        run: uv build

      - name: Verify wheel installs cleanly and version matches
        run: |
          uv pip install --system dist/*.whl
          python -c "
          import nexus_a2a
          print('nexus-a2a', nexus_a2a.__version__, 'imports OK')
          expected = '${{ needs.validate.outputs.version }}'
          actual   = nexus_a2a.__version__
          assert actual == expected, f'Version mismatch: {actual!r} != {expected!r}'
          print('Version check passed.')
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

# ── Step 4: Publish to PyPI ────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # FIX: id-token must be 'write' for OIDC — original had a hardcoded token string!
    permissions:
      id-token: write     # required for PyPI Trusted Publishing (OIDC)

    environment:
      name: pypi
      url: https://pypi.org/p/nexus-a2a

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          # No api_token needed — OIDC handles auth automatically

# ── Step 5: GitHub Release ─────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write    # required to create releases and upload assets

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for changelog generation

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate changelog from commits since last tag
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline --pretty=format:"- %s (%h)" | head -30)
            COMPARE_URL="https://github.com/dhruvil05/nexus-a2a/commits/${{ github.ref_name }}"
          else
            LOG=$(git log --oneline --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
            COMPARE_URL="https://github.com/dhruvil05/nexus-a2a/compare/${PREV_TAG}...${{ github.ref_name }}"
          fi
          {
            echo "## What's Changed"
            echo ""
            echo "$LOG"
            echo ""
            echo "**Full Changelog**: $COMPARE_URL"
          } > changelog.md
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "nexus-a2a ${{ github.ref_name }}"
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}