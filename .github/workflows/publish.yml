# .github/workflows/publish.yml
#
# Publish — triggered when a version tag (v*) is pushed.
#
# Pipeline:
#   validate  — tag matches version in pyproject.toml
#   test      — full unit test suite must pass before publishing
#   publish   — build and upload to PyPI via OIDC trusted publishing
#   release   — create GitHub Release with auto-generated changelog
#
# Requires:
#   - PyPI trusted publishing configured for this repo (no API key needed)
#   - GitHub Actions: contents:write permission for release creation

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # for GitHub Release creation
  id-token: write       # for PyPI OIDC trusted publishing

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.x"

jobs:
# ── 1. Validate tag matches pyproject.toml version ────────────────────────────
  validate:
    name: Validate version tag
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag_version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract version from pyproject.toml
        id: pkg_version
        run: |
          version=$(grep '^version' pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Assert versions match
        run: |
          TAG="${{ steps.tag_version.outputs.version }}"
          PKG="${{ steps.pkg_version.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version ($TAG) does not match pyproject.toml version ($PKG)"
            exit 1
          fi
          echo "✅ Tag v$TAG matches pyproject.toml version $PKG"

# ── 2. Run full test suite before publishing ──────────────────────────────────
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package with all extras
        run: uv pip install --system -e ".[all,dev]"

      - name: Run unit tests
        run: pytest -m "not integration" --tb=short -q

# ── 3. Build and publish to PyPI ──────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: pypi
      url: https://pypi.org/project/nexus-a2a/

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install build tools
        run: uv pip install --system build hatchling twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify build artifacts
        run: twine check dist/*

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API_KEY needed — uses OIDC identity token (id-token: write above)

# ── 4. Create GitHub Release ──────────────────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history for changelog generation

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # Extract section from CHANGELOG.md between this version header and the next
          NOTES=$(awk "/^## \[?$VERSION\]?/,/^## \[?[0-9]/" CHANGELOG.md \
                  | head -n -1 \
                  | tail -n +2)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Save multi-line output safely
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nexus-a2a ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: dist/*