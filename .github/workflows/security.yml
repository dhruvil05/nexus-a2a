# .github/workflows/security.yml
#
# Security — weekly CVE scan + CodeQL static analysis + SBOM generation.
#
# Jobs:
#   audit     — pip-audit scans all third-party deps for known CVEs
#               (nexus-a2a itself is filtered out — not on PyPI yet)
#   codeql    — GitHub CodeQL static analysis on Python source
#   sbom      — CycloneDX Software Bill of Materials (master branch only)
#   freshness — informational outdated package check (never fails CI)
#
# Schedule: every Monday at 08:00 UTC
# Also runs on push to master when pyproject.toml or source changes

name: Security

on:
  schedule:
    - cron: "0 8 * * 1"    # Every Monday at 08:00 UTC
  push:
    branches: ["master"]
    paths:
      - "pyproject.toml"
      - "nexus_a2a/**"
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: read
  security-events: write    # Required for CodeQL SARIF upload

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.x"

# ── Dependency audit ──────────────────────────────────────────────────────────
jobs:
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package with all extras
        run: uv pip install --system -e ".[all,dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      # KEY FIX: pipe freeze through grep to remove nexus-a2a itself.
      # pip-audit would fail with "Dependency not found on PyPI" because
      # nexus-a2a is a local editable install and not published yet.
      - name: Run pip-audit
        id: audit
        run: |
          pip-audit \
            --strict \
            --skip-editable \
            -r <(pip freeze | grep -v "^nexus.a2a") \
            || AUDIT_FAILED=1

          if [ "${AUDIT_FAILED:-0}" = "1" ]; then
            echo "::error::Vulnerabilities found! See artifact for details."
            pip-audit --skip-editable --format=json \
              -r <(pip freeze | grep -v "^nexus.a2a") > audit-results.json || true
            exit 1
          fi
          echo "✅ No known vulnerabilities found."

      - name: Upload audit results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results-${{ github.run_id }}
          path: audit-results.json
          retention-days: 30

# ── CodeQL static analysis ────────────────────────────────────────────────────
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest

    permissions:
      actions:         read
      contents:        read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package so CodeQL can resolve imports
        run: uv pip install --system -e ".[all]"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

# ── SBOM generation (master branch only) ─────────────────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package with all extras
        run: uv pip install --system -e ".[all,dev]"

      - name: Install CycloneDX SBOM generator
        run: pip install cyclonedx-bom

      # Try new CLI (cyclonedx-py environment) then fall back to old CLI
      - name: Generate SBOM (CycloneDX JSON)
        run: |
          pip freeze | grep -v "^nexus.a2a" > requirements-frozen.txt
          cyclonedx-py requirements \
            requirements-frozen.txt \
            --output-format json \
            --output-file nexus-a2a-sbom.json \
          || cyclonedx-py environment \
             --output-format json \
             --output-file nexus-a2a-sbom.json

          python -c "
          import json
          with open('nexus-a2a-sbom.json') as f:
              sbom = json.load(f)
          comps = sbom.get('components', [])
          print(f'SBOM generated with {len(comps)} components')
          for c in comps[:5]:
              print(f'  - {c.get(\"name\")} {c.get(\"version\", \"\")}')
          if len(comps) > 5:
              print(f'  ... and {len(comps)-5} more')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: nexus-a2a-sbom.json
          retention-days: 90

# ── Dependency freshness (informational, never fails) ─────────────────────────
  freshness:
    name: Check outdated dependencies
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package with all extras
        run: uv pip install --system -e ".[all,dev]"

      - name: List outdated packages
        run: |
          echo "=== Outdated packages (informational only) ==="
          pip list --outdated --format=columns || true
          echo ""
          echo "Update pyproject.toml when appropriate."