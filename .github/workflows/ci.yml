# .github/workflows/ci.yml
#
# Continuous Integration — runs on every push and pull request.
#
# Jobs:
#   lint      — ruff format check + lint + mypy type checking
#   test      — pytest unit tests on Python 3.11 and 3.12
#   integrate — integration tests (only when PG secret is set)
#   build     — package build verification (wheel + sdist)
#
# Triggers: push/PR on master and any version tag
# Runner: ubuntu-latest only (stable with uv --system)

name: CI

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

env:
  PYTHON_VERSION_DEFAULT: "3.12"
  UV_VERSION: "0.5.x"

# ── Lint & type-check ─────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dev dependencies
        run: uv pip install --system -e ".[all,dev]"

      - name: Ruff format check
        run: ruff format --check nexus_a2a tests

      - name: Ruff lint
        run: ruff check nexus_a2a tests

      - name: Mypy type check
        run: mypy nexus_a2a

# ── Unit tests (matrix: Python 3.11 and 3.12) ─────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package with all extras
        run: uv pip install --system -e ".[all,dev]"

      - name: Run unit tests
        run: |
          pytest \
            -m "not integration" \
            --tb=short \
            -q \
            --cov=nexus_a2a \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml \
            --cov-report=term-missing

      - name: Upload coverage (Python 3.12 only)
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/master'
        uses: codecov/codecov-action@v4
        with:
          file: coverage-3.12.xml
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

# ── Integration tests (only when PG DSN secret is available) ──────────────────
  integrate:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: test
    # Set a repo variable HAS_PG_DSN=true when you have the secret configured.
    # This avoids the "secrets not allowed in if:" GitHub error.
    if: ${{ vars.HAS_PG_DSN == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install package with all extras
        run: uv pip install --system -e ".[all,dev]"

      - name: Run integration tests
        run: pytest -m integration --tb=short -q
        env:
          NEXUS_TEST_PG_DSN: ${{ secrets.NEXUS_TEST_PG_DSN }}

# ── Build verification ─────────────────────────────────────────────────────────
  build:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install build tools
        run: uv pip install --system build hatchling

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify build artifacts
        run: |
          pip install twine
          twine check dist/*
          echo "✅ Build artifacts are valid"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7